<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT 대화 목록 가져오기</title><style>body{font:16px system-ui;background:#f3f6fb;color:#19364f;max-width:800px;margin:48px auto;padding:24px}h1{font-size:26px}p{line-height:1.7}button,select{font:inherit;padding:12px;border:1px solid #cdd9e6;border-radius:8px;margin:4px}button{cursor:pointer}#apply{background:#176e70;color:white}li{padding:8px;border-bottom:1px solid #ddd}button:disabled{opacity:.5}#status{white-space:pre-wrap}</style><h1>ChatGPT 대화 목록 가져오기</h1><p>이 Hub에 연결할 ChatGPT 계정인지 선택한 탭에서 확인하세요. ChatGPT 홈에서 사이드바를 펼쳐 두세요. 빠른 읽기는 현재 표시된 최근 목록만 확인합니다. 과거 대화까지 읽기는 사이드바를 아래로 이동하며 제목과 링크를 모읍니다. 수집 중에는 선택한 탭을 그대로 두세요. 본문과 로그인 정보는 읽지 않습니다.</p><label>읽을 ChatGPT 탭 <select id="tabs"></select></label><button id="reload">탭 목록 새로고침</button><button id="quick">최근 목록 빠르게 읽기</button><button id="read">과거 대화까지 읽기</button><button id="stop" disabled>여기까지 읽기</button><p id="status" role="status"></p><ol id="preview"></ol><button id="apply" disabled>이 목록을 Hub에 반영</button><button id="cancel">취소</button><script type="module" src="review.js"></script></html>
